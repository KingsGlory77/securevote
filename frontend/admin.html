<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecureVote - Admin Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/dashboard.css">
</head>

<body>

    <nav class="navbar navbar-expand navbar-dark">
        <div class="container">
            <span class="navbar-brand">
                SecureVote Admin
            </span>
            <div class="navbar-nav ms-auto">
                <button id="logoutBtn" class="btn btn-danger btn-sm">
                    Logout
                </button>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <!-- Top Stats Row -->
        <div class="row">
            <div class="col-md-4 mb-3">
                <div class="card shadow text-center">
                    <div class="card-body">
                        <span class="text-secondary small uppercase tracking-wider">Total Pemilih Terdaftar</span>
                        <h2 id="totalUsers" class="fw-bold text-white mt-2 mb-0">0</h2>
                    </div>
                </div>
            </div>

            <div class="col-md-4 mb-3">
                <div class="card shadow text-center">
                    <div class="card-body">
                        <span class="text-secondary small uppercase tracking-wider">Total Suara Masuk</span>
                        <h2 id="totalVotes" class="fw-bold text-white mt-2 mb-0">0</h2>
                    </div>
                </div>
            </div>

            <div class="col-md-4 mb-3">
                <div class="card shadow text-center">
                    <div class="card-body">
                        <span class="text-secondary small uppercase tracking-wider">Status Blockchain</span>
                        <h2 id="blockchainStatus" class="fw-bold mt-2 mb-0">Valid</h2>
                    </div>
                </div>
            </div>
        </div>

        <!-- Blockchain Explorer & Action Panel -->
        <div class="card shadow mt-4">
            <div class="card-body">
                <div class="d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center mb-4 gap-3">
                    <div>
                        <h4 class="m-0 text-white fw-bold">Blockchain Explorer & Auditor</h4>
                        <p class="text-secondary m-0 mt-1 small">Visualisasi rantai blok transaksi suara secara real-time</p>
                    </div>
                    <div class="d-flex gap-2">
                        <button id="attackBtn" class="btn btn-danger btn-sm">
                            Simulasi Serangan
                        </button>
                        <button id="repairBtn" class="btn btn-success btn-sm">
                            Pulihkan Database
                        </button>
                    </div>
                </div>

                <div class="p-3 rounded-4" style="background: rgba(9, 13, 22, 0.4); border: 1px solid var(--glass-border);">
                    <div id="blockchainContainer" class="blockchain-chain">
                        <!-- Loaded dynamically via JS -->
                        <div class="col-12 text-center py-4">
                            <p class="text-secondary m-0">Memuat data blockchain...</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Voting Chart & Results -->
        <div class="row mt-4 g-4">
            <div class="col-lg-6">
                <div class="card shadow h-100">
                    <div class="card-body">
                        <h4 class="text-white fw-bold mb-4">Grafik Perolehan Suara</h4>
                        <div id="resultContainer">
                            <!-- JS progress bars -->
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="col-lg-6">
                <div class="card shadow h-100">
                    <div class="card-body">
                        <h4 class="text-white fw-bold mb-4">Daftar Audit Blockchain</h4>
                        <div class="table-responsive">
                            <table class="table mb-0">
                                <thead>
                                    <tr>
                                        <th>Blok ID</th>
                                        <th>Hash Data</th>
                                        <th class="text-center">Status</th>
                                    </tr>
                                </thead>
                                <tbody id="auditTableBody">
                                    <!-- JS rows -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/dashboard.js"></script>

</body>

</html>
