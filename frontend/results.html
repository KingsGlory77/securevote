<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecureVote - Hasil Voting</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/dashboard.css">
    
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        @media print {
            body {
                background: white !important;
                color: black !important;
            }
            .navbar, .btn, .no-print {
                display: none !important;
            }
            .card {
                background: transparent !important;
                border: none !important;
                box-shadow: none !important;
            }
            .table td, .table th {
                color: black !important;
                border: 1px solid #ddd !important;
            }
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-expand navbar-dark no-print">
        <div class="container">
            <span class="navbar-brand">
                SecureVote
            </span>
            <div class="navbar-nav ms-auto">
                <a href="dashboard.html" class="btn btn-outline-light me-2 btn-sm">
                    Dashboard
                </a>
                <button id="logoutBtn" class="btn btn-danger btn-sm">
                    Logout
                </button>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="card shadow mb-5">
            <div class="card-body p-4">
                <div class="d-flex justify-content-between align-items-center mb-4 border-bottom border-secondary pb-3">
                    <div>
                        <h2 class="text-white fw-bold m-0">Hasil Pemungutan Suara</h2>
                        <p class="text-secondary m-0 mt-1 small">Data hasil voting waktu-nyata yang tersimpan secara terdesentralisasi</p>
                    </div>
                    <button class="btn btn-outline-light btn-sm no-print" onclick="window.print()">
                        🖨️ Cetak Laporan
                    </button>
                </div>

                <div class="row g-4 align-items-center">
                    <!-- Column for Chart.js -->
                    <div class="col-lg-6">
                        <div class="p-3 rounded-4" style="background: rgba(9, 13, 22, 0.4); border: 1px solid var(--glass-border);">
                            <canvas id="resultsChart" style="max-height: 320px;"></canvas>
                        </div>
                    </div>

                    <!-- Column for Details Table -->
                    <div class="col-lg-6">
                        <div class="table-responsive">
                            <table class="table">
                                <thead>
                                    <tr>
                                        <th>Pasangan Calon</th>
                                        <th class="text-center">Total Suara</th>
                                        <th class="text-center">Persentase</th>
                                    </tr>
                                </thead>
                                <tbody id="resultTable">
                                    <!-- Populated via JS -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <div class="d-flex justify-content-between mt-5 border-top border-secondary pt-4 no-print">
                    <a href="dashboard.html" class="btn btn-outline-light">
                        Kembali ke Dashboard
                    </a>
                    <button id="finishBtn" class="btn btn-success">
                        Selesai & Keluar
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/results.js"></script>

</body>

</html>
