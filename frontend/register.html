<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecureVote - Register</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/dashboard.css">
</head>

<body>

    <div class="container">
        <div class="row justify-content-center min-vh-100 align-items-center">
            <div class="col-md-5 col-lg-4">
                <div class="card shadow">
                    <div class="card-body p-4">
                        
                        <h2 class="text-center mb-4 text-white fw-bold">
                            Register Akun
                        </h2>

                        <form id="registerForm">
                            <div class="mb-3">
                                <label for="username" class="form-label text-secondary">
                                    Username
                                </label>
                                <input
                                    type="text"
                                    id="username"
                                    class="form-control"
                                    required
                                >
                            </div>

                            <div class="mb-3">
                                <label for="password" class="form-label text-secondary">
                                    Password
                                </label>
                                <input
                                    type="password"
                                    id="password"
                                    class="form-control"
                                    required
                                >
                            </div>

                            <div class="mb-4">
                                <label for="registerRole" class="form-label text-secondary">
                                    Daftar Sebagai
                                </label>
                                <select id="registerRole" class="form-select" required>
                                    <option value="user">Pengguna (Voter)</option>
                                    <option value="admin">Administrator</option>
                                </select>
                            </div>

                            <button
                                type="submit"
                                class="btn btn-success w-100"
                            >
                                Register
                            </button>
                        </form>

                        <div class="text-center mt-4">
                            <a href="login.html" class="text-secondary small">
                                Sudah punya akun? Login disini
                            </a>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="../assets/js/auth.js"></script>

</body>

</html>
